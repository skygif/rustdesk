name: Self-Host Build (baked-in server)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: "selfhost"
      publish-update-metadata: false
